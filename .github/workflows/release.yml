name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-packaging a win32 target from Linux/macOS needs Wine to
          # inject the exe's version/icon resources, so build it natively
          # on Windows instead. Same idea for macOS: build x64 and arm64
          # each on their own native architecture runner.
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: macos-x64
            os: macos-13
            platform: darwin
            arch: x64
          - name: macos-arm64
            os: macos-14
            platform: darwin
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Package (${{ matrix.platform }}/${{ matrix.arch }})
        working-directory: src
        run: npx electron-packager . PearLyrics --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --overwrite

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: src/dist
        shell: pwsh
        run: Compress-Archive -Path "PearLyrics-${{ matrix.platform }}-${{ matrix.arch }}" -DestinationPath "../../PearLyrics-${{ matrix.name }}.zip"

      - name: Zip artifact (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: src/dist
        run: zip -r "../../PearLyrics-${{ matrix.name }}.zip" "PearLyrics-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearLyrics-${{ matrix.name }}
          path: PearLyrics-${{ matrix.name }}.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
