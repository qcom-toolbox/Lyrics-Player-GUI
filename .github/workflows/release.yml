name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Cross-packaging a win32 target from Linux/macOS needs Wine to
          # inject the exe's version/icon resources, so build it natively
          # on Windows instead. macOS is a single universal (x64 + arm64)
          # binary, merged by electron-packager via @electron/universal.
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: macos-universal
            os: macos-14
            platform: darwin
            arch: universal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: src
        run: npm install

      - name: Package (${{ matrix.platform }}/${{ matrix.arch }})
        working-directory: src
        run: npx electron-packager . PearLyrics --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out=dist --overwrite

      - name: Zip artifact (Windows)
        if: runner.os == 'Windows'
        working-directory: src/dist
        shell: pwsh
        run: Compress-Archive -Path "PearLyrics-${{ matrix.platform }}-${{ matrix.arch }}" -DestinationPath "../../PearLyrics-${{ matrix.name }}.zip"

      - name: Zip artifact (macOS/Linux)
        if: runner.os != 'Windows'
        working-directory: src/dist
        run: zip -r "../../PearLyrics-${{ matrix.name }}.zip" "PearLyrics-${{ matrix.platform }}-${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PearLyrics-${{ matrix.name }}
          path: PearLyrics-${{ matrix.name }}.zip

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine release tag
        id: tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(node -p "require('./src/package.json').version")
            echo "name=v${VERSION}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: PearLyrics ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: artifacts/**/*.zip
          fail_on_unmatched_files: true
